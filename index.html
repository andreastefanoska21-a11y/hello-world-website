attribute vec3 aPos; attribute vec2 aUv;
uniform mat3 uR; uniform float uScale; uniform vec2 uRes; uniform vec2 uC; uniform float uF; uniform float uD;
varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying vec3 vP;
void main(){
  vec3 n = uR * aPos; vec3 w = n * uScale; vW = w; vP = aPos;
  float q = uD - w.z;
  float sx = uC.x + uF * w.x / q;
  float sy = uC.y - uF * w.y / q;
  float nx = sx / uRes.x * 2.0 - 1.0;
  float ny = 1.0 - sy / uRes.y * 2.0;
  float nz = (q - (uD - 1.4)) / 2.8 * 2.0 - 1.0;

}`;

var FS_GLOBE = PREC + `
uniform sampler2D uTex; uniform sampler2D uLights; uniform vec3 uSun; uniform float uPx; uniform mat3 uR;
varying vec2 vUv; varying vec3 vN; varying vec3 vP;
float h31(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
float n3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm4(vec3 p, float cell){
  float s = 0.0, a = 0.5, t = 0.0;
  for (int i = 0; i < 4; i++) { float w = smoothstep(1.0, 3.0, cell); s += a * w * n3(p); t += a * w; p *= 2.03; a *= 0.5; cell *= 0.5; }
  return t > 0.0 ? s / t : 0.5;
}
float fbm3(vec3 p, float cell){
  float s = 0.0, a = 0.5, t = 0.0;
  for (int i = 0; i < 3; i++) { float w = smoothstep(1.0, 3.0, cell); s += a * w * n3(p); t += a * w; p *= 2.03; a *= 0.5; cell *= 0.5; }
  return t > 0.0 ? s / t : 0.5;
}
void main(){
  vec3 c = texture2D(uTex, vUv).rgb;
  vec3 n = normalize(vN);
  vec3 p = normalize(vP);
  float water = clamp((c.b - max(c.r, c.g * 0.85)) * 6.0 - 0.1, 0.0, 1.0);
  float land = 1.0 - water;

  // fine surface detail and terrain relief (object-space noise, sticks to the planet)
  float d = fbm4(p * 70.0, uPx / 70.0);
  c *= mix(1.0, 0.84 + 0.32 * d, land);
  float e = 0.012, f0 = 16.0, cell0 = uPx / f0;
  float h0 = fbm3(p * f0, cell0);
  vec3 gr = vec3(fbm3((p + vec3(e,0,0)) * f0, cell0) - h0, fbm3((p + vec3(0,e,0)) * f0, cell0) - h0, fbm3((p + vec3(0,0,e)) * f0, cell0) - h0) / e;
  gr -= p * dot(gr, p);
  vec3 nb = normalize(n - (uR * gr) * 0.03 * land);

  // ocean ripples for the sun glint
  float ripple = smoothstep(1.5, 4.0, uPx / 120.0);
  vec3 wn = normalize(n + (vec3(n3(p * 120.0), n3(p * 120.0 + 7.1), n3(p * 120.0 + 13.7)) - 0.5) * 0.10 * ripple * water);

  float ndl = dot(n, uSun);
  float dayMask = smoothstep(-0.2, 0.36, ndl);
  float diff = clamp(dot(nb, uSun) * 0.92 + 0.08, 0.0, 1.0);
  vec3 col = c * (0.10 + 1.08 * diff * dayMask);

  vec3 hv = normalize(uSun + vec3(0.0, 0.0, 1.0));
  float sp = pow(max(dot(wn, hv), 0.0), 110.0) * 0.95 + pow(max(dot(n, hv), 0.0), 18.0) * 0.16;
  col += vec3(1.0, 0.95, 0.85) * sp * water * dayMask;

  float rim = pow(1.0 - clamp(n.z, 0.0, 1.0), 3.0);
  col += vec3(0.20, 0.46, 1.0) * rim * 0.62 * (0.25 + dayMask);
  col += vec3(0.55, 0.22, 0.06) * exp(-pow(ndl / 0.14, 2.0)) * 0.12 * land;

  float night = 1.0 - smoothstep(-0.10, 0.12, ndl);
  col += texture2D(uLights, vUv).rgb * night * land * 1.15;
  gl_FragColor = vec4(col, 1.0);
}`;

function flyTo(lat, lon) {
  var dLon = wrapLon(lon - state.lon);
  tween = { t0: now(), dur: 1200, lat0: state.lat, lon0: state.lon, dLat: lat - state.lat, dLon: dLon, z0: state.zoom, z1: Math.max(state.zoom, 1.45) };
}

/* ---------- naming ---------- */
function pip(lon, lat, poly) {
  var inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;

}
function distKm(lat1, lon1, lat2, lon2) {

}
function nearestCity(lat, lon) {

  return { name: best, km: bd };
}
var SEAS = [
  ['Black Sea', 41, 47.5, 27.5, 41.8], ['Red Sea', 12, 28.5, 32, 44], ['Persian Gulf', 24, 30.5, 48, 57], ['Mediterranean Sea', 30, 46, -6, 36],
  ['Caribbean Sea', 9, 22, -88, -62], ['Gulf of Mexico', 18, 30.5, -98, -81.5], ['Hudson Bay', 51, 64, -95, -78], ['North Sea', 51, 61, -3.5, 9],
  ['Baltic Sea', 53.5, 66, 10, 30], ['Sea of Japan', 34, 52, 128, 142], ['South China Sea', 0, 23, 105, 121], ['Bay of Bengal', 5, 22.5, 80, 95],
  ['Arabian Sea', 5, 25.5, 55, 75], ['Coral Sea', -25, -10, 143, 165], ['Tasman Sea', -47, -30, 150, 174], ['Sea of Okhotsk', 44, 60, 135, 160],
  ['Norwegian Sea', 62, 72, -10, 15], ['Bering Sea', 51, 66, -180, -157], ['Bering Sea', 51, 66, 165, 180]

function oceanName(lat, lon) {
  for (var i = 0; i < SEAS.length; i++) { var s = SEAS[i]; if (lat >= s[1] && lat <= s[2] && lon >= s[3] && lon <= s[4]) return s[0]; }
  if (lat > 66) return 'Arctic Ocean';
  if (lat < -60) return 'Southern Ocean';
  if (lon >= -70 && lon < 20 && lat < 8) return 'Atlantic Ocean';
  if (lon >= -100 && lon < 20 && lat >= 8) return 'Atlantic Ocean';
  if (lon >= 20 && lon < 146 && lat < 25) return 'Indian Ocean';
  return 'Pacific Ocean';
}
function continentName(key, lat, lon) {
  if (key === 'africa') return 'Africa';
  if (key === 'south_america') return 'South America';
  if (key === 'north_america') return lat < 18 ? 'Central America' : 'North America';
  if (key === 'australia') return 'Australia';
  if (key === 'chukotka') return 'Siberia';

}
function offlineName(lat, lon) {
  for (var wk in WATER) if (pip(lon, lat, WATER[wk])) return WATER_NAMES[wk];
  var hit = null;
  for (var key in LAND) {
    if (CONTINENT_KEYS[key]) continue;
    if (pip(lon, lat, LAND[key])) { hit = key; break; }
  }
  if (hit) return ISLAND_NAMES[hit];
  for (var ck in CONTINENT_KEYS) {
    if (pip(lon, lat, LAND[ck])) {

var NATURAL = ['island','archipelago','islet','peak','volcano','mountain','mountain_range','glacier','bay','strait','sea','ocean','lake','cape','desert','valley','national_park','reef','atoll'];
function pickName(d) {

  var a = d.address || {};
  var t = d.addresstype || '', ty = d.type || '';
  if (d.name && (NATURAL.indexOf(t) > -1 || NATURAL.indexOf(ty) > -1)) return d.name;
  return a.city || a.town || a.village || a.hamlet || a.municipality || a.island || a.archipelago || a.county ||
         a.state_district || a.state || a.region || a.country || d.name || null;
}

var cache = {};
var reqId = 0;
function lookup(lat, lon, cb) {
  var key = lat.toFixed(2) + ',' + lon.toFixed(2);
  if (cache[key]) { cb(cache[key], 'cache'); return; }
  var done = false, ctl = null, timer = null;
  function finish(name, src) {
    if (done) return; done = true;
    if (timer) clearTimeout(timer);
    if (ctl) { try { ctl.abort(); } catch (e) {} }

  timer = setTimeout(fallback, 3500);

            lat.toFixed(5) + '&lon=' + lon.toFixed(5);
  fetch(url, { headers: { 'Accept': 'application/json' }, signal: ctl ? ctl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function (d) {

      else fallback();       // open water: Nominatim has no ocean polygons

    .catch(function () { if (state.fetchMode === 'unknown') state.fetchMode = 'offline'; fallback(); });

/* ---------- selection + text ---------- */
var textEl = document.getElementById('text');
var firstSelection = true;
function setPlace(name) {

  textEl.classList.remove('busy');
  textEl.classList.add('shown');
}
function selectAt(px, py) {
  var hit = pick(px, py);
  if (!hit) return;
  var lat = hit.lat, lon = hit.lon;
  state.selected = { lat: lat, lon: lon, name: null };

  idleUntil = now() + 9000;

  textEl.classList.add('busy');

    setPlace(name);

}

/* ---------- main loop ---------- */
var last = now(), started = false;
function frame() {
  var t = now(), dt = Math.min(0.05, (t - last) / 1000); last = t;

requestAnimationFrame(frame);       // Earth (plain blue sphere) is on screen from the very first frame

/* build the detailed texture right after first paint, then try the real photo texture */

})();
